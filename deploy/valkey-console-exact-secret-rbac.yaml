# Foundation Console-owned data engine credential boundary.
#
# The generic Kubernetes proxy blocks every Secret path. Typed Valkey/RustFS
# endpoints authenticate console-admin+AAL2 and use server-side apply against
# this exact resourceName allowlist. The workload identity cannot create or
# list arbitrary Secrets in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foundation-console-valkey-secret-manager
  namespace: opensphere-foundation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["foundation-data-valkey-auth", "rustfs-credentials"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - foundation-data-mongodb-databaseadmin-conn-str
      - foundation-data-mongodb-ssl
      - foundation-data-mongodb-secrets
      - foundation-data-mongodb-custom-user-secret
      - foundation-data-mongodb-custom-user-secret-conn-str
    verbs: ["get"]
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbs"]
    resourceNames: ["foundation-data-mongodb"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foundation-console-valkey-secret-manager
  namespace: opensphere-foundation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foundation-console-valkey-secret-manager
subjects:
  - kind: ServiceAccount
    name: opensphere-foundation
    namespace: opensphere-console
