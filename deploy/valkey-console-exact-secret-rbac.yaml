# Foundation Console-owned Valkey credential boundary.
#
# The generic Kubernetes proxy blocks every Secret path. The typed Valkey
# endpoint authenticates console-admin+AAL2 and uses server-side apply against
# this single, fixed resource name. The workload identity cannot create or list
# arbitrary Secrets in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foundation-console-valkey-secret-manager
  namespace: opensphere-foundation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["foundation-data-valkey-auth"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foundation-console-valkey-secret-manager
  namespace: opensphere-foundation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foundation-console-valkey-secret-manager
subjects:
  - kind: ServiceAccount
    name: opensphere-foundation
    namespace: opensphere-console
