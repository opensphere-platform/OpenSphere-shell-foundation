# foundation-control-plane의 계약 watch/status 및 관리 번들 배포 권한.
# 2026-07-06: 라이브에만 있던 Role을 리포 정본화(drift 해소 — 감사 S2와 동일 원칙) +
#   Samba-AD operand 편입(identity 번들)으로 persistentvolumeclaims 추가.
#   ⚠️ PVC verbs에 delete/deletecollection 미포함 — withdraw 회수에서도 AD 데이터(SAM DB) 보존
#   (identity_bundle.yaml PVC 주석·bundleKinds와 동일 정책).
apiVersion: v1
kind: Namespace
metadata: { name: opensphere-system }
---
apiVersion: v1
kind: Namespace
metadata: { name: opensphere-foundation }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: foundation-control-plane, namespace: opensphere-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: foundation-control-plane-core }
rules:
  - apiGroups: ["foundation.opensphere.io"]
    resources: [foundationmodels, foundationclaims, foundationbindings]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["foundation.opensphere.io"]
    resources: [foundationmodels/status, foundationclaims/status, foundationbindings/status]
    verbs: [get, update, patch]
  - apiGroups: ["foundation.opensphere.io"]
    resources: [foundationclaims/finalizers, foundationbindings/finalizers]
    verbs: [update]
  # PostgreSQL Fleet northbound contract and catalog. Claims/installations are
  # cluster-watched because each consumer namespace may own dedicated clusters.
  - apiGroups: ["provisioning.opensphere.io"]
    resources: [postgresclaims]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["provisioning.opensphere.io"]
    resources: [postgresclaims/status]
    verbs: [get, update, patch]
  - apiGroups: ["provisioning.opensphere.io"]
    resources: [postgresclaims/finalizers]
    verbs: [update]
  - apiGroups: ["catalog.opensphere.io"]
    resources: [addonplans, postgresruntimecatalogs]
    verbs: [get, list, watch]
  - apiGroups: ["catalog.opensphere.io"]
    resources: [addoninstalls]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["catalog.opensphere.io"]
    resources: [addoninstalls/status]
    verbs: [get, update, patch]
  # Crossplane is the non-secret southbound bridge. The Foundation controller
  # owns Object declarations; provider-kubernetes owns the rendered StackGres,
  # RBAC and monitoring resources.
  - apiGroups: ["kubernetes.m.crossplane.io"]
    resources: [objects]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  # Namespace-first PostgreSQL Fleet. The reconciler itself checks that a
  # namespace is Foundation-registered with purpose=postgres-fleet before it
  # applies anything; cluster-wide RBAC is required so one controller can
  # reconcile the approved tenant namespaces without static RoleBindings.
  - apiGroups: ["stackgres.io"]
    resources: [sgclusters, sgscripts, sginstanceprofiles, sgpgconfigs, sgpoolconfigs, sgobjectstorages]
    verbs: [get, list, watch]
  # Namespace-first PSMDB service claims. The reconciler accepts only the
  # Foundation namespace or namespaces registered with purpose=pfss-service.
  - apiGroups: ["psmdb.percona.com"]
    resources: [perconaservermongodbs, perconaservermongodbbackups, perconaservermongodbrestores]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  # OpenSearch is reconciled through the upstream OpenSearch Kubernetes
  # Operator. Foundation owns only its cluster/user/role declarations.
  - apiGroups: ["opensearch.opster.io"]
    resources: [opensearchclusters, opensearchusers, opensearchroles, opensearchuserrolebindings]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  # Grafana Operator owns the workloads and remote API synchronization.
  # Foundation owns only the northbound instance/content/access declarations.
  - apiGroups: ["grafana.integreatly.org"]
    resources: [grafanas, grafanadashboards, grafanadatasources, grafanaserviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: [get, list, watch]
  - apiGroups: ["monitoring.coreos.com"]
    resources: [podmonitors]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch]
  # External Operator adapters are discovery-only. Foundation never mutates
  # these workloads or CRDs; it only projects their authoritative readiness.
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: ["argoproj.io"]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  - apiGroups: ["pkg.crossplane.io"]
    resources: [providers, providerrevisions]
    verbs: [get, list, watch]
  - apiGroups: ["backup.opensphere.io"]
    resources: [backuppolicies, backupruns, restoreruns]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["backup.opensphere.io"]
    resources: [backuppolicies/status, backupruns/status, restoreruns/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: foundation-control-plane-core }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: foundation-control-plane-core }
subjects:
  - { kind: ServiceAccount, name: foundation-control-plane, namespace: opensphere-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foundation-control-plane-deployer
  namespace: opensphere-foundation
rules:
  - apiGroups: [""]
    resources: [serviceaccounts, configmaps, services]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["apps"]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  # PostgreSQL Fleet southbound access remains namespace-scoped. Every object
  # also carries provisioning.opensphere.io/postgres-claim for exact cleanup.
  - apiGroups: ["stackgres.io"]
    resources: [sgclusters, sgscripts, sginstanceprofiles, sgpgconfigs, sgpoolconfigs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, patch, delete, deletecollection]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: [get, list, watch]
  - apiGroups: ["psmdb.percona.com"]
    resources: [perconaservermongodbs]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["opensearch.opster.io"]
    resources: [opensearchclusters, opensearchusers, opensearchroles, opensearchuserrolebindings]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["grafana.integreatly.org"]
    resources: [grafanas, grafanadashboards, grafanadatasources, grafanaserviceaccounts]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  # 승인된 Valkey 관측 계약: 이 namespace의 ServiceMonitor만 선언·회수한다.
  - apiGroups: ["monitoring.coreos.com"]
    resources: [servicemonitors, podmonitors, prometheusrules]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  # Samba plugin operand의 기존 LDAPS Certificate를 같은 identity SSA에서
  # 재적용한다. Issuer와 생성 Secret은 cert-manager 소유이므로 권한을 주지 않는다.
  - apiGroups: ["cert-manager.io"]
    resources: [certificates]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  - apiGroups: ["cert-manager.io"]
    resources: [issuers]
    verbs: [get, list, watch, create, patch, delete, deletecollection]
  # Data engine 자격은 platform installer가 최초 생성한다. Control Plane은
  # exact Secret 존재와 필수 key만 검증하며 생성·회전·삭제하지 않는다.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - foundation-data-valkey-auth
      - rustfs-credentials
      - foundation-identity-syncope-runtime
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: foundation-control-plane-deployer, namespace: opensphere-foundation }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: foundation-control-plane-deployer }
subjects:
  - { kind: ServiceAccount, name: foundation-control-plane, namespace: opensphere-system }
