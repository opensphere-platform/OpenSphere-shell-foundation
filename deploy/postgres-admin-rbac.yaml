# PostgreSQL object administration reads one fixed CNPG application Secret only.
# The generic Kubernetes proxy still blocks every Secret path. The backend uses
# the verified Console administrator identity, so this privilege is granted to
# the fixed projected administrator group rather than the Foundation workload SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foundation-postgres-admin-credential-reader
  namespace: opensphere-foundation
  labels:
    opensphere.io/managed-by: foundation
    opensphere.io/purpose: exact-secret-access
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["foundation-data-pg-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foundation-postgres-admin-credential-reader
  namespace: opensphere-foundation
  labels:
    opensphere.io/managed-by: foundation
    opensphere.io/purpose: exact-secret-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foundation-postgres-admin-credential-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: opensphere-console-admins
