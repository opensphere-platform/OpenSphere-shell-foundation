# Foundation control-plane core contracts.
# FoundationModel/Descriptor are cluster-scoped platform declarations;
# Claim/Binding are namespaced consumer contracts. Spec/status intentionally
# preserve engine-specific fields while keeping lifecycle fields typed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationmodels.foundation.opensphere.io
spec:
  group: foundation.opensphere.io
  scope: Cluster
  names:
    plural: foundationmodels
    singular: foundationmodel
    kind: FoundationModel
    shortNames: [fm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Model, type: string, jsonPath: .spec.model }
        - { name: Desired, type: string, jsonPath: .spec.desiredState }
        - { name: Phase, type: string, jsonPath: .status.phase }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [model, desiredState]
              properties:
                model: { type: string }
                desiredState:
                  type: string
                  enum: [Installed, Disabled]
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationmoduledescriptors.foundation.opensphere.io
spec:
  group: foundation.opensphere.io
  scope: Cluster
  names:
    plural: foundationmoduledescriptors
    singular: foundationmoduledescriptor
    kind: FoundationModuleDescriptor
    shortNames: [fmd]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationclaims.foundation.opensphere.io
spec:
  group: foundation.opensphere.io
  scope: Namespaced
  names:
    plural: foundationclaims
    singular: foundationclaim
    kind: FoundationClaim
    shortNames: [fc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [model]
              properties:
                model: { type: string }
                module:
                  type: string
                  description: >-
                    소비할 PFSS 모듈 ID입니다. 생략하면 기존 model 단위 공유
                    binding 계약으로 동작합니다.
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                request:
                  type: object
                  description: 모듈별 Operator가 수렴할 요청 종류와 대상입니다.
                  properties:
                    type:
                      type: string
                      enum:
                        - Instance
                        - Database
                        - Access
                        - Bucket
                        - Index
                        - Realm
                        - Client
                        - Directory
                        - Policy
                        - Route
                        - Project
                        - MailDomain
                        - Mailbox
                        - Workflow
                        - Workspace
                        - Pipeline
                        - Tenant
                        - Dashboard
                        - DataSource
                        - BackupPolicy
                        - Restore
                        - Application
                        - Provider
                    targetRef:
                      type: object
                      properties:
                        apiVersion: { type: string }
                        kind: { type: string }
                        name: { type: string }
                        namespace: { type: string }
                      required: [name]
                profileRef:
                  type: object
                  properties:
                    name: { type: string }
                    namespace: { type: string }
                  required: [name]
                credentialSecretRef:
                  type: object
                  description: >-
                    자격 증명 원문이 아니라 동일 Namespace의 Secret 참조만 허용합니다.
                  properties:
                    name: { type: string }
                  required: [name]
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationbindings.foundation.opensphere.io
spec:
  group: foundation.opensphere.io
  scope: Namespaced
  names:
    plural: foundationbindings
    singular: foundationbinding
    kind: FoundationBinding
    shortNames: [fb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [claimRef, endpoint]
              properties:
                claimRef:
                  type: object
                  required: [name, namespace]
                  properties:
                    name: { type: string }
                    namespace: { type: string }
                endpoint: { type: string }
                module: { type: string }
                endpoints:
                  type: array
                  items:
                    type: object
                    required: [name, uri]
                    properties:
                      name: { type: string }
                      uri: { type: string }
                      protocol: { type: string }
                      readOnly: { type: boolean }
                secretRef:
                  type: object
                  properties:
                    name: { type: string }
                    namespace: { type: string }
                  required: [name, namespace]
                resourceRef:
                  type: object
                  properties:
                    apiVersion: { type: string }
                    kind: { type: string }
                    name: { type: string }
                    namespace: { type: string }
                  required: [kind, name]
                capabilities:
                  type: array
                  items: { type: string }
                dependencies:
                  type: array
                  description: >-
                    제어면이 실제로 수렴·연결 확인한 하위 서비스 Binding입니다.
                    선언된 의존성 목록이 아니라 현재 연결 증거만 게시합니다.
                  items:
                    type: object
                    required: [module, requestType, required]
                    properties:
                      module: { type: string }
                      requestType: { type: string }
                      required: { type: boolean }
                      endpoint: { type: string }
                      bindingRef:
                        type: object
                        properties:
                          name: { type: string }
                          namespace: { type: string }
                        required: [name, namespace]
                      resourceRef:
                        type: object
                        properties:
                          apiVersion: { type: string }
                          kind: { type: string }
                          name: { type: string }
                          namespace: { type: string }
                        required: [kind, name]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
