# PostgreSQL Fleet northbound contract. A claim can allocate a dedicated instance,
# a database on a managed instance, or a scoped login to an existing database.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresclaims.provisioning.opensphere.io
spec:
  group: provisioning.opensphere.io
  scope: Namespaced
  names:
    plural: postgresclaims
    singular: postgresclaim
    kind: PostgresClaim
    shortNames: [pgclaim, pgc]
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema: &postgresClaimSchema
          type: object
          properties:
            spec:
              type: object
              required: [database, owner]
              properties:
                database: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$-]{0,62}$' }
                owner: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$-]{0,62}$' }
                postgresVersion:
                  type: string
                  pattern: '^[0-9]+(?:\.[0-9]+)?$'
                  description: Approved PostgreSQL runtime selected by the request. Its major version must match the AddOnPlan.
                version: { type: string }
                engine: { type: string }
                storageClass: { type: string }
                size: { type: string, pattern: '^[0-9]+(Mi|Gi|Ti)$' }
                planRef:
                  type: object
                  properties:
                    name: { type: string }
                isolation:
                  type: string
                  default: Dedicated
                  enum: [Dedicated, SharedDatabase, DatabaseAccess]
                clusterRef:
                  type: object
                  description: Dedicated PostgresClaim used by SharedDatabase and DatabaseAccess requests.
                  required: [name, namespace]
                  properties:
                    name: { type: string }
                    namespace: { type: string }
                access:
                  type: string
                  description: Database privilege contract. SharedDatabase uses Owner; DatabaseAccess uses ReadOnly or ReadWrite.
                  enum: [Owner, ReadOnly, ReadWrite]
                connectionLimit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                storage:
                  type: object
                  properties:
                    size: { type: string, pattern: '^[0-9]+(Mi|Gi|Ti)$' }
                    storageClass: { type: string }
                deletionPolicy:
                  type: string
                  enum: [Retain, Delete]
                backupPolicyRef:
                  type: object
                  properties:
                    name: { type: string }
                placementRef:
                  type: object
                  properties:
                    name: { type: string }
                profileRefs:
                  type: object
                  description: Native StackGres configuration objects adopted by this claim.
                  properties:
                    instanceProfile: { type: string }
                    postgresConfig: { type: string }
                    poolingConfig: { type: string }
                    objectStorage: { type: string }
                extensions:
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                      name: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$-]{0,62}$' }
                      version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$' }
                      publisher: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }
                      repository: { type: string, pattern: '^https://' }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Mode, type: string, jsonPath: .spec.isolation }
        - { name: Plan, type: string, jsonPath: .spec.planRef.name }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Cluster, type: string, jsonPath: .status.providerRef.name }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema: *postgresClaimSchema
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Mode, type: string, jsonPath: .spec.isolation }
        - { name: Plan, type: string, jsonPath: .spec.planRef.name }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Cluster, type: string, jsonPath: .status.providerRef.name }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
---
