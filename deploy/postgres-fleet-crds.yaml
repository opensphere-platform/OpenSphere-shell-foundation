# PostgreSQL Fleet northbound contracts.
# PostgresClaim v1alpha1 remains served for existing shared-CNPG consumers;
# v1beta1 is the storage version and provisions one isolated StackGres cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresclaims.provisioning.opensphere.io
spec:
  group: provisioning.opensphere.io
  scope: Namespaced
  names:
    plural: postgresclaims
    singular: postgresclaim
    kind: PostgresClaim
    shortNames: [pgclaim, pgc]
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema: &postgresClaimSchema
          type: object
          properties:
            spec:
              type: object
              required: [database, owner]
              properties:
                database: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$-]{0,62}$' }
                owner: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$-]{0,62}$' }
                version: { type: string }
                engine: { type: string }
                storageClass: { type: string }
                size: { type: string, pattern: '^[0-9]+(Mi|Gi|Ti)$' }
                planRef:
                  type: object
                  properties:
                    name: { type: string }
                isolation:
                  type: string
                  enum: [Dedicated, LegacyShared]
                storage:
                  type: object
                  properties:
                    size: { type: string, pattern: '^[0-9]+(Mi|Gi|Ti)$' }
                    storageClass: { type: string }
                deletionPolicy:
                  type: string
                  enum: [Retain, Delete]
                backupPolicyRef:
                  type: object
                  properties:
                    name: { type: string }
                placementRef:
                  type: object
                  properties:
                    name: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Mode, type: string, jsonPath: .spec.isolation }
        - { name: Plan, type: string, jsonPath: .spec.planRef.name }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Cluster, type: string, jsonPath: .status.providerRef.name }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema: *postgresClaimSchema
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Mode, type: string, jsonPath: .spec.isolation }
        - { name: Plan, type: string, jsonPath: .spec.planRef.name }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Cluster, type: string, jsonPath: .status.providerRef.name }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
---
