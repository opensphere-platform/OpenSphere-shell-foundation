apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: addonplans.catalog.opensphere.io
spec:
  group: catalog.opensphere.io
  scope: Cluster
  names: { plural: addonplans, singular: addonplan, kind: AddOnPlan }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [capabilityRef, offeringRef, provider, instances, resources, storage]
              properties:
                capabilityRef: { type: string }
                offeringRef: { type: string }
                provider: { type: string, enum: [stackgres] }
                lifecycle: { type: string, enum: [Preview, Available, Deprecated] }
                postgresVersion: { type: string }
                instances: { type: integer, minimum: 1 }
                profile: { type: string, enum: [development, testing, production] }
                resources:
                  type: object
                  required: [cpu, memory]
                  properties:
                    cpu: { type: string }
                    memory: { type: string }
                storage:
                  type: object
                  required: [size]
                  properties:
                    size: { type: string }
                    storageClass: { type: string }
                pooling: { type: boolean }
                backup:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    retention: { type: integer, minimum: 1 }
                    cronSchedule: { type: string }
                    objectStorageRef: { type: string }
                profileRefs:
                  type: object
                  description: Approved native StackGres profile references applied by this plan.
                  properties:
                    instanceProfile: { type: string }
                    postgresConfig: { type: string }
                    poolingConfig: { type: string }
                    objectStorage: { type: string }
                constraints: { type: object, x-kubernetes-preserve-unknown-fields: true }
            status: { type: object, x-kubernetes-preserve-unknown-fields: true }
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Provider, type: string, jsonPath: .spec.provider }
        - { name: Instances, type: integer, jsonPath: .spec.instances }
        - { name: Lifecycle, type: string, jsonPath: .spec.lifecycle }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresruntimecatalogs.catalog.opensphere.io
spec:
  group: catalog.opensphere.io
  scope: Cluster
  names:
    plural: postgresruntimecatalogs
    singular: postgresruntimecatalog
    kind: PostgresRuntimeCatalog
    shortNames: [pgruntime, pgrt]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [provider, operatorVersion, defaultVersion, versions]
              properties:
                provider: { type: string, enum: [stackgres] }
                operatorVersion: { type: string }
                defaultVersion: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
                versions:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [version]
                  items:
                    type: object
                    required: [version, major, patroniVersion, image, lifecycle]
                    properties:
                      version: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
                      major: { type: string, pattern: '^[0-9]+$' }
                      patroniVersion: { type: string }
                      image:
                        type: string
                        pattern: '^ghcr\.io/opensphere-platform/mirror/ongres/patroni@sha256:[a-f0-9]{64}$'
                      upstreamImage: { type: string }
                      lifecycle: { type: string, enum: [Available, Deprecated, Disabled] }
            status: { type: object, x-kubernetes-preserve-unknown-fields: true }
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Provider, type: string, jsonPath: .spec.provider }
        - { name: Operator, type: string, jsonPath: .spec.operatorVersion }
        - { name: Default, type: string, jsonPath: .spec.defaultVersion }
---
