                planRef: { type: string }
                claimRef:
                  type: object
                  required: [apiVersion, kind, name]
                  properties:
                    apiVersion: { type: string }
                    kind: { type: string }
                    name: { type: string }
                    uid: { type: string }
                deletionPolicy: { type: string, enum: [Retain, Delete] }
                renderedResources:
                  type: array
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
                profileRefs:
                  type: object
                  description: Native StackGres profile references resolved for this installation.
                  properties:
                    instanceProfile: { type: string }
                    postgresConfig: { type: string }
                    poolingConfig: { type: string }
                    objectStorage: { type: string }
            status: { type: object, x-kubernetes-preserve-unknown-fields: true }
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Plan, type: string, jsonPath: .spec.planRef }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
