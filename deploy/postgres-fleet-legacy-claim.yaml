# Non-destructive registration of the pre-existing shared CloudNativePG cluster.
# This Claim never provisions, mutates, or deletes foundation-data-pg.
apiVersion: provisioning.opensphere.io/v1beta1
kind: PostgresClaim
metadata:
  name: foundation-data-pg-legacy
  namespace: opensphere-foundation
  labels:
    app.kubernetes.io/part-of: pfss-postgresql
    provisioning.opensphere.io/migration-role: source
spec:
  isolation: LegacyShared
  database: appdb
  owner: app
  deletionPolicy: Retain
