# Foundation PostgreSQL bootstrap. StackGres is the sole execution engine.
apiVersion: provisioning.opensphere.io/v1beta1
kind: PostgresClaim
metadata:
  name: foundation-data-pg
  namespace: opensphere-foundation
  labels:
    opensphere.io/foundation-module: postgres
    catalog.opensphere.io/provider: stackgres
spec:
  database: appdb
  owner: appuser
  isolation: Dedicated
  planRef: { name: postgresql-dev-single }
  storage: { size: 10Gi, storageClass: ceph-rbd }
  deletionPolicy: Delete
