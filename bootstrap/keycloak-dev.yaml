# Foundation 모듈: Keycloak — workspace/사원 IAM (dev). DB는 Foundation PostgreSQL 소비(백킹서비스 소비 모델).
# Kanidm과 무관(Kanidm=콘솔관리자 별개 영역). keycloak DB는 전용 StackGres PostgresClaim으로 발급한다.
---
apiVersion: provisioning.opensphere.io/v1beta1
kind: PostgresClaim
metadata:
  name: foundation-identity-keycloak-pg
  namespace: opensphere-foundation
  labels: { opensphere.io/foundation-module: keycloak }
spec:
  database: keycloak
  owner: keycloak
  isolation: Dedicated
  planRef: { name: postgresql-dev-single }
  deletionPolicy: Delete
---
apiVersion: v1
kind: Service
metadata:
  name: opensphere-keycloak
  namespace: opensphere-foundation
  labels: { opensphere.io/foundation-module: keycloak }
spec:
  selector: { app: opensphere-keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: mgmt, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensphere-keycloak
  namespace: opensphere-foundation
  labels: { opensphere.io/foundation-module: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app: opensphere-keycloak } }
  template:
    metadata: { labels: { app: opensphere-keycloak } }
    spec:
      containers:
        - name: keycloak
          # image-source: ghcr-mirror(ok) origin=quay.io/keycloak/keycloak:26.0 — [[ghcr-image-mirror-policy]]
          image: ghcr.io/opensphere-platform/mirror/keycloak:26.0
          args: ["start-dev"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://pgc-foundation-identity-keycloak-pg.opensphere-foundation.svc:5432/keycloak" }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: username } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: password } } }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }   # dev only — prod override
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "768Mi" }
            limits: { memory: "2Gi" }   # KC26 start-dev augmentation 단계가 메모리 집약 — 1Gi는 OOM
