# Foundation 모듈: OpenSearch — opensearch-k8s-operator 단일노드 공유 클러스터 (dev).
# operator: helm install opensearch-operator opensearch-operator/opensearch-operator -n opensearch-operator-system (cert-manager 필요)
# ⚠️ JVM heap 명시 pin(-Xms512m -Xmx512m) — 미설정 시 컨테이너 메모리 초과 OOM(가장 빈번한 dev 실패).
apiVersion: opensearch.opster.io/v1
kind: OpenSearchCluster
metadata:
  name: opensphere-search
  namespace: opensphere-foundation
  labels:
    opensphere.io/foundation-module: opensearch
spec:
  # Upstream otherwise injects docker.io/busybox:latest into generated workloads.
  initHelper:
    image: ghcr.io/opensphere-platform/mirror/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    imagePullPolicy: IfNotPresent
  general:
    serviceName: opensphere-search
    version: "3.7.0"
    setVMMaxMapCount: false
  security:
    tls:
      transport: { generate: true, perNode: true }
      http: { generate: true }
    config:
      adminCredentialsSecret:
        name: opensphere-search-admin-credentials
  dashboards:
    enable: false
    replicas: 1
    version: "3.7.0"
  nodePools:
    - component: nodes
      replicas: 1
      diskSize: "5Gi"
      jvm: "-Xms512m -Xmx512m"
      roles:
        - "cluster_manager"
        - "data"
        - "ingest"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          memory: "2Gi"
      persistence:
        pvc:
          storageClass: "standard"
          accessModes:
            - ReadWriteOnce
