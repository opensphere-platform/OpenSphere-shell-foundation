# identity operand 번들 — control plane이 SSA로 적용(__NAMESPACE__/__IMAGE__ 치환).
# D-3: Keycloak production operand. Runtime state is stored in a dedicated
# StackGres PostgresClaim and bootstrap administrator credentials are supplied
# by the exact-name Secret foundation-identity-keycloak-admin.
#   최초 기동에 필요한 workforce realm은 control-plane 소유 CM `keycloak-realm-import`로 함께 선언한다.
#   설치 후 realm/client 운영은 Keycloak Admin API 계약으로 조정하며 Syncope·IGA lifecycle과 분리한다.
# 2026-07-06 self-contained: Samba-AD operand 선언은 이 번들에서 제거됨 — plugin(OpenSphere-plugin-directory)이
#   소유하고 GET /operand/manifests로 내민다. control-plane은 engines.samba=enabled면 그 선언을 fetch해
#   라벨 스탬프 후 SSA apply(buildIdentityBundle). 이 파일엔 keycloak operand만 남는다.
#   엔진별 설치옵션: FoundationModel.spec.parameters.engines.{keycloak|samba} = enabled|disabled.
#   Syncope(IGA + SCIM 2.0 endpoint/connector)·OPA는 D-7(정직: 미배포).
# INV-2(JIT 금지): realm은 registrationAllowed:false + identityProviders 없음(first-broker-login 자동생성 경로 부재). G-JIT가 강제(소스+realm 스캔).
# 사용자 프로비저닝 권위=Syncope(D-7)이므로 슬라이스엔 사용자/시크릿을 심지 않는다(OIDC issuer 라이브 + discovery/JWKS로 실증).
# 클라이언트는 public+PKCE(S256), redirectUris/webOrigins는 와일드카드 호스트 금지(D-7 실 소비자 온보딩 시 확정 — 현재 placeholder).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundation-identity-keycloak
  namespace: __NAMESPACE__
  labels: { foundation.opensphere.io/engine: keycloak }
---
apiVersion: provisioning.opensphere.io/v1beta1
kind: PostgresClaim
metadata:
  name: foundation-identity-keycloak-pg
  namespace: __NAMESPACE__
  labels: { foundation.opensphere.io/engine: keycloak, catalog.opensphere.io/provider: stackgres }
spec:
  database: keycloak
  owner: keycloak
  isolation: Dedicated
  planRef: { name: postgresql-dev-single }
  deletionPolicy: Retain
---
# Keycloak은 --import-realm을 기동 시 한 번만 처리한다. 따라서 설치 선언과 realm seed를 한 번에
# reconcile하여 "Deployment는 있으나 realm이 없어 readiness 404"인 반쪽 설치를 만들지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: __NAMESPACE__
  labels: { foundation.opensphere.io/engine: keycloak }
data:
  opensphere-workforce-realm.json: |
    {
      "realm": "opensphere-workforce",
      "enabled": true,
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": false,
      "verifyEmail": true,
      "sslRequired": "external",
      "bruteForceProtected": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundation-identity-keycloak
  namespace: __NAMESPACE__
  labels: { foundation.opensphere.io/engine: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: foundation-identity-keycloak }
  template:
    metadata:
      labels: { app: foundation-identity-keycloak }
    spec:
      serviceAccountName: foundation-identity-keycloak
      automountServiceAccountToken: false   # Keycloak은 k8s API 불필요 — 토큰 미마운트(블래스트 반경 축소)
      imagePullSecrets:
        - name: opensphere-ghcr-pull
      securityContext: { runAsNonRoot: true }
      containers:
        - name: keycloak
          image: __IMAGE__
          args: ["start", "--import-realm"]
          env:
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL_HOST, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: host } } }
            - { name: KC_DB_URL_PORT, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: port } } }
            - { name: KC_DB_URL_DATABASE, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: database } } }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: username } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: pgc-foundation-identity-keycloak-pg-binding, key: password } } }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: { secretKeyRef: { name: foundation-identity-keycloak-admin, key: username } } }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: foundation-identity-keycloak-admin, key: password } } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          # Keycloak augmentation and realm import are memory intensive.
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1536Mi } }
          # Quarkus augmentation writes below /opt/keycloak during initial start.
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm-import, optional: false }
---
apiVersion: v1
kind: Service
metadata:
  name: foundation-identity-keycloak
  namespace: __NAMESPACE__
  labels: { foundation.opensphere.io/engine: keycloak }
spec:
  selector: { app: foundation-identity-keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# default-deny 클러스터에서도 소비자→OIDC(8080) 도달 보장.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: foundation-identity-keycloak
  namespace: __NAMESPACE__
  labels: { foundation.opensphere.io/engine: keycloak }
spec:
  podSelector:
    matchLabels: { app: foundation-identity-keycloak }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
